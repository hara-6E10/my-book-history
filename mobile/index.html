<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>読書履歴登録</title>

  <meta name="theme-color" content="#45664f">
  <link rel="manifest" href="/manifest.json?v=6">

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 20px;
    background: #f7f5ef;
    color: #34483c;
    font-family: "Noto Sans JP", sans-serif;
    line-height: 1.6;
  }

  h1 {
    text-align: center;
    font-size: 24px;
    margin: 20px 0 28px;
  }

  h2 {
    font-size: 19px;
    margin-bottom: 18px;
  }

  #login-area,
  #register-area,
  #list-area {
    max-width: 600px;
    margin: 0 auto 20px;
    padding: 20px;
    background: #fffefa;
    border: 1px solid #e8e4d9;
    border-radius: 14px;
    box-shadow: 0 3px 10px #34483c0a;
  }

  input,
  textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #d8d8d0;
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    background: #fff;
  }

  textarea {
    resize: vertical;
  }

  button {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: #45664f;
    color: white;
    font-size: 14px;
    cursor: pointer;
  }

  #reader {
    margin: 12px auto;
  }

  #result {
    color: #788579;
    font-size: 13px;
  }

  /* 書籍カード */
  .book-card {
    background: #fffefa;
    border: 1px solid #e8e4d9;
    border-radius: 14px;
    padding: 18px;
    margin: 14px 0;
    box-shadow: 0 3px 10px #34483c0a;
    overflow: hidden;
  }

  .book-title {
    font-size: 18px;
    font-weight: bold;
    margin: -18px -18px 14px;
    padding: 14px 18px;
    background: #e5ede3;
    color: #355740;
    border-radius: 14px 14px 0 0;
  }

  .book-info {
    font-size: 14px;
    color: #788579;
    margin: 5px 0;
    overflow-wrap: anywhere;
  }

  .book-actions {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 16px;
  }

  .book-edit {
    background: #e5ede3;
    color: #355740;
  }

  .book-delete {
    background: #f5e7e1;
    color: #8a5144;
  }

  #new-book-button {
    display: block;
    margin: 20px auto 0;
  }
/* ページ上部 */
.page-header {
  max-width: 600px;
  margin: 0 auto 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.page-header h1 {
  text-align: left;
  font-size: 21px;
  margin: 10px 0;
}

/* アカウント表示 */
#account-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

#account-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #45664f;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  font-weight: bold;
}

#logout-button {
  padding: 3px 8px;
  font-size: 11px;
  background: #e5ede3;
  color: #355740;
}

/* タブ */
#tab-area {
  max-width: 600px;
  margin: 0 auto;
  display: flex;
  gap: 2px;
  background: #f7f5ef;
}

#tab-area button {
  flex: 1;
  padding: 13px 6px;
  background: #fffefa;
  color: #355740;
  border: none;
  border-radius: 8px 8px 0 0;
  font-size: 14px;
}

#tab-area button.active {
  background: #45664f;
  color: #ffffff;
  font-weight: bold;
}

  @media (max-width: 480px) {
    body {
      padding: 12px;
    }

    #login-area,
    #register-area,
    #list-area {
      padding: 16px;
    }
  }

  /* 読書履歴の見出し */
.list-heading {
  text-align: center;
  margin: 8px 0 28px;
}

.list-heading h2 {
  font-size: 18px;
  letter-spacing: 2px;
  color: #45664f;
  margin: 16px 0 4px;
}

.list-heading p {
  font-size: 12px;
  color: #788579;
  margin: 0 0 16px;
}

.heading-line {
  height: 1px;
  background: #cbd5c8;
  width: 80%;
  margin: 0 auto;
}

/* タブと一覧画面をつなげる */
#tab-area {
  gap: 0;
}

#list-area {
  margin-top: 0;
  border-radius: 0 0 14px 14px;
}

/* 新しい本を登録する画面もタブにつなげる */
#register-area {
  margin-top: 0;
  border-radius: 0 0 14px 14px;
}
</style>


<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

  import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  serverTimestamp,
  updateDoc,
  deleteDoc,
  doc,
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

let editingBookId = null;
let searchKeyword = "";
let searchYear = "";
let searchMonth = "";


  const firebaseConfig = {
    apiKey: "AIzaSyBdoejqqrqEOUyCcLH6KwmUVcglBQNM33I",
    authDomain: "my-book-history-d8b8e.firebaseapp.com",
    projectId: "my-book-history-d8b8e",
    storageBucket: "my-book-history-d8b8e.firebasestorage.app",
    messagingSenderId: "967856062859",
    appId: "1:967856062859:web:38fcbe49de80c3b0f3af8e"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // ログイン状態を確認する
  onAuthStateChanged(auth, async (user) => {
        const loginArea = document.getElementById("login-area");

    if (user) {
// ログイン中の画面
loginArea.style.display = "none";

// アカウントアイコンを表示
const accountArea = document.getElementById("account-area");
const accountIcon = document.getElementById("account-icon");

accountArea.style.display = "flex";
accountIcon.textContent = user.email.charAt(0).toUpperCase();

// タブを表示
document.getElementById("tab-area").style.display = "flex";

// ログアウトボタンの処理
document.getElementById("logout-button").addEventListener("click", async () => {
  try {
    await signOut(auth);

    // ログアウト後に画面を再読み込み
    window.location.reload();

  } catch (error) {
    alert("ログアウトエラー：" + error.message);
  }
});

  // 登録画面を隠して一覧を表示
  document.getElementById("register-area").style.display = "none";
  document.getElementById("list-area").style.display = "block";

  // 登録済みの本を表示
  await showBookList();



    } else {
      // ログアウト中は登録画面と一覧画面を隠す
      document.getElementById("register-area").style.display = "none";
      document.getElementById("list-area").style.display = "none";
      
      // ログイン画面
      loginArea.innerHTML = `
        <h2>ログイン</h2>
        <p><input type="email" id="email" placeholder="メールアドレス"></p>
        <p><input type="password" id="password" placeholder="パスワード"></p>
        <button id="login-button">ログイン</button>
        <button id="signup-button">新規登録</button>
        <p id="login-message"></p>
      `;

      // 新規登録ボタンの処理
      document.getElementById("signup-button").addEventListener("click", async () => {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const message = document.getElementById("login-message");

        try {
          await createUserWithEmailAndPassword(auth, email, password);
          message.textContent = "新規登録できました！";
        } catch (error) {
          message.textContent = "登録エラー：" + error.message;
        }
      });

      // ログインボタンの処理
      document.getElementById("login-button").addEventListener("click", async () => {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const message = document.getElementById("login-message");

        try {
          await signInWithEmailAndPassword(auth, email, password);
          message.textContent = "ログインできました！";
        } catch (error) {
          message.textContent = "ログインエラー：" + error.message;
        }
      });
    }
  });

  // 検索窓に入力したときの処理
const searchInput = document.getElementById("search-input");

if (searchInput) {
  searchInput.addEventListener("input", async () => {
    searchKeyword = searchInput.value;
    await showBookList();
  });
}

// 年月を選択したときの処理
const yearSearch = document.getElementById("year-search");
const monthSearch = document.getElementById("month-search");

if (yearSearch) {
  yearSearch.addEventListener("change", async () => {
    searchYear = yearSearch.value;
    await showBookList();
  });
}

if (monthSearch) {
  monthSearch.addEventListener("change", async () => {
    searchMonth = monthSearch.value;
    await showBookList();
  });
}

// 登録ボタンを押したときの処理
// 登録・編集ボタンを押したときの処理
document.getElementById("save-button").addEventListener("click", async () => {

const user = auth.currentUser;

if (!user) {
  alert("保存するにはログインしてください");
  return;
}

const isbn = document.getElementById("isbn").value.trim();
const title = document.getElementById("book-title").value.trim();
const author = document.getElementById("author").value.trim();
const borrowDate = document.getElementById("borrow-date").value;

const memo = document.getElementById("memo").value;

if (!isbn || !title || !borrowDate) {
  alert("ISBN・書名・借りた日を入力してください");
  return;
}

try {
  const bookData = {
  isbn: isbn,
  title: title,
  author: author,
  borrowDate: borrowDate,
  memo: memo
  };


  if (editingBookId === null) {
    // 新しい本を登録
    await addDoc(
      collection(db, "users", user.uid, "books"),
      {
        ...bookData,
        createdAt: serverTimestamp()
      }
    );

    alert("本を登録しました！");

  } else {
    // 登録済みの本を編集
    await updateDoc(
      doc(db, "users", user.uid, "books", editingBookId),
      bookData
    );

    alert("本の情報を変更しました！");
    editingBookId = null;
  }

  // ボタンの表示を元に戻す
  document.getElementById("save-button").textContent = "登録する";

  // 読書履歴タブに戻る
showListTab();

await showBookList();

} catch (error) {
  alert("保存エラー：" + error.message);
}
});

  // タブ切り替え処理

const listTab = document.getElementById("list-tab");
const registerTab = document.getElementById("register-tab");

function showListTab() {
  document.getElementById("list-area").style.display = "block";
  document.getElementById("register-area").style.display = "none";

  listTab.classList.add("active");
  registerTab.classList.remove("active");
}

function showRegisterTab() {
  document.getElementById("list-area").style.display = "none";
  document.getElementById("register-area").style.display = "block";

  listTab.classList.remove("active");
  registerTab.classList.add("active");
}

// 読書履歴タブ
listTab.addEventListener("click", async () => {
  showListTab();
  await showBookList();
});

// 新しい本を登録タブ
registerTab.addEventListener("click", () => {
  editingBookId = null;

  document.getElementById("save-button").textContent = "登録する";
  document.getElementById("isbn").value = "";
  document.getElementById("book-title").value = "";
  document.getElementById("author").value = "";
  document.getElementById("borrow-date").value = "";
  document.getElementById("memo").value = "";
  document.getElementById("result").textContent =
    "ここに読み取り状況を表示します";

  showRegisterTab();
});

  // 登録済みの本を一覧表示する処理
async function showBookList() {
  const user = auth.currentUser;

  if (!user) {
    alert("一覧を見るにはログインしてください");
    return;
  }

  const bookList = document.getElementById("book-list");

  try {
    const snapshot = await getDocs(
      collection(db, "users", user.uid, "books")
    );

    bookList.innerHTML = "";

    if (snapshot.empty) {
      bookList.textContent = "まだ本が登録されていません。";
      return;
    }

    // 借りた日が新しい順に並べ替える
    const books = snapshot.docs.map((document) => ({
      id: document.id,
      ...document.data()
    }));

    // 登録されている本の年を取得
    const yearSearch = document.getElementById("year-search");

    if (yearSearch) {
    const years = [
      ...new Set(
        books
          .map((book) => (book.borrowDate || "").slice(0, 4))
          .filter((year) => /^\d{4}$/.test(year))
      )
      ].sort((a, b) => b.localeCompare(a));

    yearSearch.innerHTML = '<option value="">すべての年</option>';

    years.forEach((year) => {
    const option = document.createElement("option");
    option.value = year;
    option.textContent = year + "年";
    yearSearch.appendChild(option);
    });

    yearSearch.value = searchYear;
  }

// 検索キーワードで絞り込む
// 検索キーワードと年月で絞り込む
const keyword = searchKeyword.trim().toLowerCase();

const filteredBooks = books.filter((book) => {
  const date = book.borrowDate || "";

  const matchesKeyword =
    (book.title || "").toLowerCase().includes(keyword) ||
    (book.author || "").toLowerCase().includes(keyword);

  const matchesYear =
    !searchYear || date.slice(0, 4) === searchYear;

  const matchesMonth =
    !searchMonth || date.slice(5, 7) === searchMonth;

  return matchesKeyword && matchesYear && matchesMonth;
});

// 検索結果が0件の場合
if (filteredBooks.length === 0) {
  bookList.textContent = "該当する本が見つかりませんでした。";
  return;
}

filteredBooks.sort((a, b) =>
  (b.borrowDate || "").localeCompare(a.borrowDate || "")
);

filteredBooks.forEach((book) => {
      const item = document.createElement("div");
      item.className = "book-card";

      item.innerHTML =
      "<h3 class='book-title'>" + book.title + "</h3>" +
      "<p class='book-info'>著者：" + (book.author || "") + "</p>" +
      "<p class='book-info'>ISBN：" + book.isbn + "</p>" +
      "<p class='book-info'>借りた日：" + book.borrowDate + "</p>" +
      "<p class='book-info'>メモ：" + (book.memo || "なし") + "</p>";

      // 編集ボタン
      const editButton = document.createElement("button");
      editButton.textContent = "編集";
      editButton.className = "book-edit";

      editButton.addEventListener("click", () => {
        editingBookId = book.id;

        document.getElementById("isbn").value = book.isbn || "";
        document.getElementById("book-title").value = book.title || "";
        document.getElementById("author").value = book.author || "";
        document.getElementById("borrow-date").value = book.borrowDate || "";
        document.getElementById("memo").value = book.memo || "";

        document.getElementById("list-area").style.display = "none";
        document.getElementById("register-area").style.display = "block";

        document.getElementById("save-button").textContent = "変更を保存する";
      });

      const actions = document.createElement("div");
      actions.className = "book-actions";
      actions.appendChild(editButton);

      // 削除ボタン
      const deleteButton = document.createElement("button");
      deleteButton.textContent = "削除";
      deleteButton.className = "book-delete";

      deleteButton.addEventListener("click", async () => {
        if (!confirm("この本の履歴を削除しますか？")) {
          return;
        }

        await deleteDoc(
          doc(db, "users", user.uid, "books", book.id)
        );

        await showBookList();
      });

      actions.appendChild(deleteButton);
      item.appendChild(actions);
      bookList.appendChild(item);
    });

  } catch (error) {
    bookList.textContent = "一覧の読み込みエラー：" + error.message;
  }
}

</script>

</head>

  
<body>
  <header class="page-header">
    <h1>📚 読書履歴登録</h1>
  
    <div id="account-area" style="display:none;">
      <div id="account-icon"></div>
      <button id="logout-button">ログアウト</button>
    </div>
  </header>

  <div id="login-area">
    <h2>ログイン</h2>
  
    <p>
      <input type="email" id="email" placeholder="メールアドレス">
    </p>
  
    <p>
      <input type="password" id="password" placeholder="パスワード">
    </p>
  
    <button id="login-button">ログイン</button>
    <button id="signup-button">新規登録</button>
  
    <p id="login-message"></p>
   
    
  </div>
  <nav id="tab-area" style="display:none;">
    <button id="list-tab" class="active">📚 読書履歴</button>
    <button id="register-tab">＋ 新しい本を登録</button>
  </nav>

  <div id="register-area" style="display:none;">
    <p>本のバーコードを読み取ってください。</p>
    <button id="scan-button">バーコードを読み取る</button>
        <div id="reader" style="width: 100%; max-width: 400px;">
        </div>
        <p id="result">ここに読み取り状況を表示します
        </p>
    <div id="book-form">
        <p>
            ISBN：
            <input type="text" id="isbn">
        </p>
  
        <p>
            書名：
            <input type="text" id="book-title">
        </p>
  
        <p>
            著者：
            <input type="text" id="author">
        </p>
  
        <p>
            借りた日：
            <input type="date" id="borrow-date">
        </p>
        <p>
          メモ：
          <textarea
            id="memo"
            rows="4"
            placeholder="本の感想や気になったことなど"
          >
          </textarea>
        </p>

        <button id="save-button">登録する</button>
    </div>

</div>
    <div id="list-area" style="display:none;">
      <div class="list-heading">
        <div class="heading-line"></div>
        <h2>📚 MY BOOKSHELF</h2>
        <p>これまでに読んだ本・借りた本</p>
        <div class="heading-line"></div>
      </div>
    
          <!-- 検索窓 -->
          <div class="search-area">
            <input
              type="text"
              id="search-input"
              placeholder="🔍 タイトル・著者名で検索"
            >
          </div>

          <!-- 年月検索 -->
          <div class="date-search-area">
            <select id="year-search">
            <option value="">すべての年</option>
            </select>

            <select id="month-search">
              <option value="">すべての月</option>
              <option value="01">1月</option>
              <option value="02">2月</option>
              <option value="03">3月</option>
              <option value="04">4月</option>
              <option value="05">5月</option>
              <option value="06">6月</option>
              <option value="07">7月</option>
              <option value="08">8月</option>
              <option value="09">9月</option>
              <option value="10">10月</option>
              <option value="11">11月</option>
              <option value="12">12月</option>
            </select>
          </div>
  
          <div id="book-list">
          ここに登録した本が表示されます。
          </div>
          </div>

          <script src="https://unpkg.com/html5-qrcode"></script>
          <script>

          // 読み取りボタンを押したときの処理
            document.getElementById("scan-button").addEventListener("click", async () => {
  
            const result = document.getElementById("result");
            result.textContent = "カメラを起動しています...";
  
          try {
            // バーコード読み取り機能を準備
            const scanner = new Html5Qrcode("reader", {
            formatsToSupport: [
            Html5QrcodeSupportedFormats.EAN_13
          ]
          });
  
          await scanner.start(
            { facingMode: "environment" },
            {
            fps: 10,
            qrbox: { width: 250, height: 150 }
            },
            async (decodedText) => {
            
          result.textContent = "📚 ISBN：" + decodedText;
          
          // カメラを停止
            await scanner.stop();
          
          // ISBNから本の情報を取得
          result.textContent = "本の情報を調べています...";

      try {
        const response = await fetch(
        `https://api.openbd.jp/v1/get?isbn=${decodedText}`
        );

      if (!response.ok) {
        throw new Error("本の情報が見つかりませんでした");
        }

      const data = await response.json();

      if (!data || !data[0] || !data[0].summary) {
        throw new Error("本の情報が見つかりませんでした");
        }

      const book = data[0].summary;

      document.getElementById("isbn").value = decodedText;
      document.getElementById("book-title").value = book.title || "";

      // まずOpenBDから著者名を取得
      let author = book.author || "";

// OpenBDに著者名がなければGoogle Booksで検索
if (!author) {
  const googleResponse = await fetch(
    `https://www.googleapis.com/books/v1/volumes?q=isbn:${decodedText}`
  );

  if (googleResponse.ok) {
    const googleData = await googleResponse.json();

    if (googleData.items && googleData.items.length > 0) {
      author = googleData.items[0].volumeInfo.authors?.join("、") || "";
    }
  }
}

// 著者名を入力欄にセット
document.getElementById("author").value = author;

result.textContent = "本の情報を取得しました。";


  } catch (error) {
    result.textContent = error.message;
  }
},

          () => {
            // 読み取り中のエラーは無視
          }
        );
  
      } catch (error) {
        result.textContent = "カメラを起動できませんでした：" + error;
      }
    });
  </script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js")
        .then(() => console.log("Service Worker 登録成功"))
        .catch(error => console.error("Service Worker 登録失敗:", error));
    });
  }
</script>

</body>
</html>
